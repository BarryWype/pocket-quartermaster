# Builds a signed release APK and attaches it to a GitHub release.
# Run it by pushing a version tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# Needs the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see README → Releases).
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Read by app.config.js: the visible version comes from the tag, and the
      # version code grows with every run so each APK installs as an update.
      APP_VERSION: ${{ github.ref_name }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Check
        run: |
          npx tsc --noEmit
          npx jest

      - name: Strip the "v" from the version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. See README → Releases."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build the APK
        working-directory: android
        env:
          # Picked up by plugins/withReleaseSigning.js as Gradle properties.
          ORG_GRADLE_PROJECT_PQ_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_PQ_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PQ_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PQ_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK after the version
        run: mv android/app/build/outputs/apk/release/app-release.apk "pocket-quartermaster-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: pocket-quartermaster-*.apk
          generate_release_notes: true
