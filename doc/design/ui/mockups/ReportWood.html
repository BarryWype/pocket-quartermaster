<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expedition report — wood and brass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Fantaisie';src:url(/_blob/5b1e7bdb2a304b22ed34c8110385ae44) format('truetype');font-display:swap}
body{margin:0}
a{color:#C9A04E}a:hover{color:#E8C877}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: repeating-linear-gradient(0deg, #3A2314 0 23px, #331F11 23px 24px); color: #F2E4C2; font-family: Alegreya, Georgia, serif; display: flex; flex-direction: column">

  <header style="height: 66px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: repeating-linear-gradient(0deg, #5A3820 0 15px, #4E301B 15px 16px); border-bottom: 3px solid #1E120A; box-shadow: inset 0 -3px 0 #C9A04E">
    <a href="MapWood.dc.html" aria-label="Back to the map" style="width: 44px; height: 44px; background: #3A2314; border: 2px solid #1E120A; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; text-align: center; font-family: Fantaisie, serif; font-size: 30px; color: #F6D98E; text-shadow: 0 2px 0 #1E120A">Expeditions</div>
    <div style="width: 44px"></div>
  </header>

  <div style="display: flex; flex-grow: 1; min-height: 0">
    <nav aria-label="Expeditions" style="width: 74px; flex-shrink: 0; background: #2A180D; border-right: 3px solid #1E120A; box-shadow: inset -2px 0 0 #5A3820; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 18px">
      <sc-for list="{{rail}}" as="r" hint-placeholder-count="3">
        <a href="{{r.href}}" aria-label="{{r.label}}" style="{{r.style}}">
          <sc-if value="{{r.img}}" hint-placeholder-val="{{true}}"><img src="{{r.src}}" alt="" width="32" height="32" style="transform: rotate(-45deg); image-rendering: pixelated"></sc-if>
          <sc-if value="{{r.svg}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="#F2E4C2" stroke="#1E120A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-45deg)"><path d="M6 3h11l2 3v15H6z M9 9h7 M9 13h7 M9 17h4"/></svg></sc-if>
        </a>
        <span style="font-family: Fantaisie, serif; font-size: 15px; color: {{r.color}}; margin: 2px 0 6px; text-align: center; line-height: 1">{{r.short}}</span>
      </sc-for>
    </nav>

    <div style="flex-grow: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px">
      <article style="background: #F2E4C2; color: #3A2314; border: 3px solid #1E120A; box-shadow: inset 0 0 0 3px #F2E4C2, inset 0 0 0 5px #C9A04E, 0 4px 0 #1E120A; display: flex; flex-direction: column">
        <div style="padding: 10px 12px 8px; background: repeating-linear-gradient(0deg, #5A3820 0 13px, #4E301B 13px 14px); border-bottom: 3px solid #1E120A; text-align: center; display: flex; flex-direction: column">
          <span style="align-self: center; padding: 0 10px; background: #2F6B32; border: 2px solid #1E120A; color: #FFF1DC; font-family: Fantaisie, serif; font-size: 16px">Victory</span>
          <span style="font-family: Fantaisie, serif; font-size: 26px; color: #F6D98E; line-height: 1.2">Rat Cellar</span>
          <span style="font-size: 12px; color: #E2CFA4">Lyra · back 2 min ago · first win today</span>
        </div>

        <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-family: Fantaisie, serif; font-size: 19px">Spoils</span>
          <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px">
            <sc-for list="{{loot}}" as="l" hint-placeholder-count="5">
              <div style="{{l.style}}">
                <sc-if value="{{l.img}}" hint-placeholder-val="{{false}}"><img src="{{l.src}}" alt="" width="28" height="28" style="image-rendering: pixelated"></sc-if>
                <sc-if value="{{l.svg}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{l.fill}}" stroke="#1E120A" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="{{l.path}}"/></svg></sc-if>
                <span style="position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: 700; color: #F2E4C2; text-shadow: 0 1px 0 #1E120A">{{l.n}}</span>
              </div>
            </sc-for>
          </div>
          <span style="font-size: 14px; font-weight: 700; color: #A8741E">New blueprint: Wooden Spear</span>
        </div>

        <div style="padding: 8px 12px; border-top: 2px dashed #B9A27A; display: flex; flex-direction: column; gap: 2px; font-size: 14px; font-weight: 700">
          <div style="display: flex; justify-content: space-between"><span style="color: #6A4A2C">XP</span><span style="color: #2F6B32">Lyra +30</span></div>
          <div style="display: flex; justify-content: space-between"><span style="color: #6A4A2C">HP</span><span style="color: #8A2E1C">Lyra 24 → 18</span></div>
        </div>

        <div style="padding: 8px 12px 12px; border-top: 2px dashed #B9A27A; display: flex; flex-direction: column; gap: 5px">
          <span style="font-family: Fantaisie, serif; font-size: 19px">The run</span>
          <sc-for list="{{log}}" as="g" hint-placeholder-count="4">
            <div style="display: flex; gap: 8px; font-size: 14px; line-height: 1.3">
              <span style="width: 9px; height: 9px; margin-top: 5px; flex-shrink: 0; transform: rotate(45deg); background: {{g.c}}; border: 1px solid #1E120A"></span>
              <span>{{g.t}}</span>
            </div>
          </sc-for>
        </div>
      </article>

      <sc-for list="{{older}}" as="o" hint-placeholder-count="2">
        <button style="min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #2A180D; border: 2px solid #1E120A; outline: 2px solid #4E301B; outline-offset: -5px; color: #F2E4C2; font-family: inherit; text-align: left">
          <span style="font-family: Fantaisie, serif; font-size: 16px; color: {{o.c}}; width: 62px">{{o.result}}</span>
          <span style="flex-grow: 1; font-size: 15px">{{o.name}}</span>
          <span style="font-size: 12px; color: #C9B48A">{{o.when}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rd = 'position: relative; width: 52px; height: 52px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; border: 2px solid #1E120A; margin-top: 6px; ';
    const on = rd + 'background: #7A4A26; outline: 2px solid #F6D98E; outline-offset: -6px; box-shadow: 0 0 0 2px #C9A04E;';
    const off = rd + 'background: #3A2314; outline: 2px solid #8A6A34; outline-offset: -6px;';
    const rail = [
      { label: 'Dungeons', short: 'Dungeons', href: 'DungeonsWood.dc.html', img: true, svg: false, src: '/_blob/d2616ec772c39a703efe4b1603eaabfb', style: off, color: '#C9B48A' },
      { label: 'Teams out', short: 'Teams out', href: 'TeamsOutWood.dc.html', img: true, svg: false, src: '/_blob/9a6033395c4b1de89a1fe7017278bb04', style: off, color: '#C9B48A' },
      { label: 'Reports', short: 'Reports', href: 'ReportWood.dc.html', img: false, svg: true, src: '', style: on, color: '#F6D98E' }
    ];
    const P = {
      gold: 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z',
      bone: 'M7 7a2 2 0 1 1 2-3 2 2 0 1 1 3 2l6 6a2 2 0 1 1 3 2 2 2 0 1 1-2 3 2 2 0 1 1-3-2L7 9a2 2 0 1 1-3-2z',
      fang: 'M6 4h12l-3 9-3 7-3-7z',
      scroll: 'M7 4h11v13a3 3 0 0 1-3 3H6a3 3 0 0 1 0-6h9V4z'
    };
    const slot = 'position: relative; aspect-ratio: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; background: #3A2314; border: 2px solid #1E120A; ';
    const loot = [
      { path: P.gold, fill: '#E8B83A', n: '12' }, { src: '/_blob/8c840ef431d52c2916e1cac29e59fe8f', n: '2' }, { path: P.bone, fill: '#EDE3CC', n: '1' },
      { path: P.fang, fill: '#E8E0C8', n: '1' }, { path: P.scroll, fill: '#E8D6A8', n: '', hi: true }
    ].map((l) => ({ ...l, img: !!l.src, svg: !!l.path, src: l.src ?? '', path: l.path ?? '', fill: l.fill ?? 'none', style: slot + (l.hi ? 'outline: 2px solid #F6D98E; outline-offset: -5px; box-shadow: 0 0 0 2px #C9A04E;' : 'outline: 2px solid #8A6A34; outline-offset: -5px;') }));
    const log = [
      { t: 'Giant rats ×3 — cleared in 2 rounds', c: '#4E9A3E' },
      { t: 'Rusty snare — Lyra slipped past (Finesse)', c: '#4E9A3E' },
      { t: 'Cellar spiders — Lyra hurt (−6 HP)', c: '#B4471C' },
      { t: 'Rat King — felled in 4 rounds', c: '#E8B83A' }
    ];
    const older = [{ result: 'Victory', c: '#8FD18A', name: 'Spider Burrow', when: '1 h ago' }, { result: 'Retreat', c: '#F2A08A', name: 'Goblin Warren', when: 'Yesterday' }];
    return { rail, loot, log, older };
  }
}
</script>
</body>
</html>
