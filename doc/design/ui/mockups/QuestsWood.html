<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quests — wood and brass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Fantaisie';src:url(/_blob/5b1e7bdb2a304b22ed34c8110385ae44) format('truetype');font-display:swap}
body{margin:0}
a{color:#C9A04E}a:hover{color:#E8C877}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: repeating-linear-gradient(0deg, #3A2314 0 23px, #331F11 23px 24px); color: #F2E4C2; font-family: Alegreya, Georgia, serif; display: flex; flex-direction: column">

  <header style="height: 66px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: repeating-linear-gradient(0deg, #5A3820 0 15px, #4E301B 15px 16px); border-bottom: 3px solid #1E120A; box-shadow: inset 0 -3px 0 #C9A04E">
    <a href="MapWood.dc.html" aria-label="Back to the map" style="width: 44px; height: 44px; background: #3A2314; border: 2px solid #1E120A; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; text-align: center; font-family: Fantaisie, serif; font-size: 30px; color: #F6D98E; text-shadow: 0 2px 0 #1E120A">Quest Board</div>
    <div style="width: 44px"></div>
  </header>

  <div style="display: flex; flex-grow: 1; min-height: 0">
    <nav aria-label="Quest board" style="width: 74px; flex-shrink: 0; background: #2A180D; border-right: 3px solid #1E120A; box-shadow: inset -2px 0 0 #5A3820; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 18px">
      <button aria-label="Daily quests" style="width: 52px; height: 52px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid #1E120A; margin-top: 6px; background: #7A4A26; outline: 2px solid #F6D98E; outline-offset: -6px; box-shadow: 0 0 0 2px #C9A04E">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#F2E4C2" stroke="#1E120A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-45deg)"><path d="M6 3h11l2 3v15H6z M9 9h7 M9 13h7 M9 17h4"/></svg>
      </button>
      <span style="font-family: Fantaisie, serif; font-size: 15px; color: #F6D98E; margin: 2px 0 6px">Daily</span>
      <button aria-label="Step chests" style="width: 52px; height: 52px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid #1E120A; margin-top: 6px; background: #3A2314; outline: 2px solid #8A6A34; outline-offset: -6px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#B07A3E" stroke="#1E120A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-45deg)"><path d="M3 10h18v10H3z M3 10c0-4 3-6 9-6s9 2 9 6z M10 12h4v4h-4z"/></svg>
      </button>
      <span style="font-family: Fantaisie, serif; font-size: 15px; color: #C9B48A; margin: 2px 0 6px">Chests</span>
    </nav>

    <div style="flex-grow: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: Fantaisie, serif; font-size: 19px; color: #F6D98E">Today's notices</span>
        <span style="font-size: 13px; color: #C9B48A">1 free reroll</span>
      </div>

      <sc-for list="{{quests}}" as="q" hint-placeholder-count="3">
        <article style="{{q.card}}">
          <span aria-hidden="true" style="position: absolute; left: 50%; top: -9px; width: 14px; height: 14px; margin-left: -7px; border-radius: 7px; background: #8A2E1C; border: 2px solid #1E120A"></span>
          <h2 style="margin: 0; font-family: Fantaisie, serif; font-weight: 400; font-size: 21px; line-height: 1.1">{{q.title}}</h2>
          <span style="font-size: 13px; color: #6A4A2C">{{q.sub}}</span>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">
            <div style="flex-grow: 1; height: 12px; background: #3A2314; border: 2px solid #1E120A"><div style="{{q.bar}}"></div></div>
            <span>{{q.progress}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 5px">
            <sc-for list="{{q.rewards}}" as="r" hint-placeholder-count="4">
              <span style="{{r.style}}">
                <sc-if value="{{r.img}}" hint-placeholder-val="{{false}}"><img src="{{r.src}}" alt="" width="24" height="24" style="image-rendering: pixelated"></sc-if>
                <sc-if value="{{r.svg}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{r.fill}}" stroke="#1E120A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="{{r.path}}"/></svg></sc-if>
              </span>
            </sc-for>
            <span style="flex-grow: 1"></span>
            <sc-if value="{{q.done}}" hint-placeholder-val="{{false}}">
              <button style="min-height: 44px; padding: 0 14px; border: 3px solid #1E120A; background: #B4471C; color: #FFF1DC; font-family: Fantaisie, serif; font-size: 20px; box-shadow: inset 2px 2px 0 #E07A3E, inset -2px -3px 0 #6E2A0E">Claim</button>
            </sc-if>
            <sc-if value="{{q.open}}" hint-placeholder-val="{{true}}">
              <button style="min-height: 44px; padding: 0 12px; border: 2px solid #1E120A; background: #3A2314; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; font-family: Fantaisie, serif; font-size: 17px">Reroll</button>
            </sc-if>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      gold: 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z',
      gem: 'M6 4h12l3 5-9 11L3 9z',
      potion: 'M10 3h4v5l4 5a5 5 0 0 1-4 8h-4a5 5 0 0 1-4-8l4-5z',
      key: 'M8 14a4 4 0 1 0 0-8a4 4 0 1 0 0 8z M11 11l9 9-2 2-3-3-1 1-2-2 1-1-4-4z',
      map: 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z'
    };
    const WOOD = '/_blob/8c840ef431d52c2916e1cac29e59fe8f';
    const slot = 'width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #3A2314; border: 2px solid #1E120A; ';
    const r = (k, maybe = false) => ({
      img: k === 'wood', svg: k !== 'wood', src: k === 'wood' ? WOOD : '', path: P[k] ?? '',
      fill: { gold: '#E8B83A', gem: '#6FC1D9', potion: '#C9473A', key: '#E8B83A', map: '#E8D6A8' }[k] ?? 'none',
      style: slot + (maybe ? 'border-style: dashed; opacity: 0.6;' : 'outline: 2px solid #8A6A34; outline-offset: -5px;')
    });
    const card = 'position: relative; padding: 12px 12px 10px; background: #F2E4C2; color: #3A2314; border: 3px solid #1E120A; box-shadow: inset 0 0 0 3px #F2E4C2, inset 0 0 0 5px #C9A04E, 0 4px 0 #1E120A; display: flex; flex-direction: column; gap: 6px; ';
    const quests = [
      { title: 'Gather 6 herbs', sub: 'Anywhere on your walks', pct: 100, progress: '6/6', done: true, rewards: [r('gold'), r('potion'), r('gem')], card: card + 'transform: rotate(-1deg);' },
      { title: 'Visit the marked place', sub: '350 m west · 47 h left', pct: 0, progress: '0/1', done: false, rewards: [r('gold'), r('wood'), r('gem'), r('key', true), r('map', true)], card: card + 'transform: rotate(0.8deg);' },
      { title: 'Beat 2 patrols', sub: 'Your escort counts too', pct: 50, progress: '1/2', done: false, rewards: [r('gold'), r('wood'), r('potion')], card: card + 'transform: rotate(-0.5deg);' }
    ].map((q) => ({ ...q, open: !q.done, bar: `width: ${q.pct}%; height: 100%; background: ${q.done ? '#E07A3E' : '#C9A04E'}; box-shadow: inset 0 2px 0 rgba(255,255,255,0.3);` }));
    return { quests };
  }
}
</script>
</body>
</html>
