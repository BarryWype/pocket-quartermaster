<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero stats — wood and brass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Fantaisie';src:url(/_blob/5b1e7bdb2a304b22ed34c8110385ae44) format('truetype');font-display:swap}
body{margin:0}
a{color:#C9A04E}a:hover{color:#E8C877}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: repeating-linear-gradient(0deg, #3A2314 0 23px, #331F11 23px 24px); color: #F2E4C2; font-family: Alegreya, Georgia, serif; display: flex; flex-direction: column">

  <header style="height: 66px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: repeating-linear-gradient(0deg, #5A3820 0 15px, #4E301B 15px 16px); border-bottom: 3px solid #1E120A">
    <a href="TeamWood.dc.html" aria-label="Back to the barracks" style="width: 44px; height: 44px; background: #3A2314; border: 2px solid #1E120A; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; text-align: center; font-family: Fantaisie, serif; font-size: 30px; color: #F6D98E; text-shadow: 0 2px 0 #1E120A">Bram</div>
    <button aria-label="Next hero" style="width: 44px; height: 44px; background: #3A2314; border: 2px solid #1E120A; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </header>

  <nav role="tablist" aria-label="Hero" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 8px 12px 0; background: #2A180D; border-bottom: 3px solid #1E120A">
    <a role="tab" aria-selected="false" href="HeroWood.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; background: #4E301B; color: #C9B48A; border: 2px solid #1E120A; border-bottom: none; font-family: Fantaisie, serif; font-size: 19px; text-decoration: none">Summary</a>
    <a role="tab" aria-selected="true" href="HeroStatsWood.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; background: #F2E4C2; color: #3A2314; border: 2px solid #1E120A; border-bottom: none; font-family: Fantaisie, serif; font-size: 19px; text-decoration: none; margin-bottom: -3px">Stats</a>
    <a role="tab" aria-selected="false" href="HeroGearWood.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; background: #4E301B; color: #C9B48A; border: 2px solid #1E120A; border-bottom: none; font-family: Fantaisie, serif; font-size: 19px; text-decoration: none">Equipment</a>
  </nav>

  <div style="margin: 0 12px; padding: 16px 14px; background: #F2E4C2; color: #3A2314; border: 3px solid #1E120A; border-top: none; box-shadow: 0 4px 0 #1E120A; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: Fantaisie, serif; font-size: 22px">In combat</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="9">
        <div style="padding: 6px 8px; background: {{s.bg}}; border: 2px solid #1E120A; box-shadow: inset 2px 2px 0 #FFF6DE, inset -2px -2px 0 #C9B48A; display: flex; flex-direction: column">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #6A4A2C">{{s.k}}</span>
          <span style="font-size: 25px; font-weight: 700; line-height: 1.1; color: {{s.color}}">{{s.v}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 14px; color: #6A4A2C; line-height: 1.35">Power drives his blows (he fights with a sword). His Wooden sword adds 4 Power and 5% Crit.</span>

    <div style="height: 0; border-top: 2px dashed #B9A27A"></div>

    <span style="font-family: Fantaisie, serif; font-size: 22px">Approaches</span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{approaches}}" as="a" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 32px">
          <span style="width: 86px; font-size: 16px; font-weight: 700">{{a.name}}</span>
          <span style="display: flex; gap: 9px; flex-grow: 1">
            <sc-for list="{{a.pips}}" as="p" hint-placeholder-count="5"><span style="{{p}}"></span></sc-for>
          </span>
          <span style="font-weight: 700; font-size: 16px">{{a.score}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 14px; color: #6A4A2C">Approaches answer threats in briefings. +1 of your choice at levels 5 and 10.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const stats = [['HP', '35', 1], ['POWER', '9', 1], ['MAGIC', '0', 0], ['ARMOUR', '3', 1], ['RESIST', '1', 1], ['EVASION', '0%', 0], ['SPEED', '5', 1], ['CRIT', '10%', 1], ['LUCK', '0', 0]]
      .map(([k, v, on]) => ({ k, v, bg: on ? '#EADBB5' : '#E2D6BA', color: on ? '#3A2314' : '#A08C6C' }));
    const pip = (on) => `width: 16px; height: 16px; transform: rotate(45deg); border: 2px solid #1E120A; ${on ? 'background: #B4471C; box-shadow: inset 2px 2px 0 #E07A3E;' : 'background: #E2D2AC;'}`;
    const approaches = [['Might', 3], ['Finesse', 1], ['Wits', 1], ['Faith', 1], ['Presence', 2]].map(([name, score]) => ({ name, score, pips: [0, 1, 2, 3, 4].map((i) => pip(i < score)) }));
    return { stats, approaches };
  }
}
</script>
</body>
</html>
