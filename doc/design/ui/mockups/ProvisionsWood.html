<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Provisions — wood and brass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Fantaisie';src:url(/_blob/5b1e7bdb2a304b22ed34c8110385ae44) format('truetype');font-display:swap}
body{margin:0}
a{color:#C9A04E}a:hover{color:#E8C877}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: repeating-linear-gradient(0deg, #3A2314 0 23px, #331F11 23px 24px); color: #F2E4C2; font-family: Alegreya, Georgia, serif; display: flex; flex-direction: column">

  <header style="height: 66px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: repeating-linear-gradient(0deg, #5A3820 0 15px, #4E301B 15px 16px); border-bottom: 3px solid #1E120A; box-shadow: inset 0 -3px 0 #C9A04E">
    <a href="MapWood.dc.html" aria-label="Back to the map" style="width: 44px; height: 44px; background: #3A2314; border: 2px solid #1E120A; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; text-align: center; font-family: Fantaisie, serif; font-size: 30px; color: #F6D98E; text-shadow: 0 2px 0 #1E120A">Provisions</div>
    <div style="width: 44px"></div>
  </header>

  <div style="display: flex; flex-grow: 1; min-height: 0">
    <nav aria-label="Workshop" style="width: 74px; flex-shrink: 0; background: #2A180D; border-right: 3px solid #1E120A; box-shadow: inset -2px 0 0 #5A3820; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 18px">
      <button aria-label="Kitchen" style="width: 52px; height: 52px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid #1E120A; margin-top: 6px; background: #7A4A26; outline: 2px solid #F6D98E; outline-offset: -6px; box-shadow: 0 0 0 2px #C9A04E">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#8A8F96" stroke="#1E120A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-45deg)"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z M2 11h2 M20 11h2"/></svg>
      </button>
      <span style="font-family: Fantaisie, serif; font-size: 15px; color: #F6D98E; margin: 2px 0 6px">Kitchen</span>
      <button aria-label="Alchemy" style="width: 52px; height: 52px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid #1E120A; margin-top: 6px; background: #3A2314; outline: 2px solid #8A6A34; outline-offset: -6px">
        <img src="/_blob/cc5846841f2e109471763a9e47915d87" alt="" width="32" height="32" style="transform: rotate(-45deg); image-rendering: pixelated">
      </button>
      <span style="font-family: Fantaisie, serif; font-size: 15px; color: #C9B48A; margin: 2px 0 6px">Alchemy</span>
    </nav>

    <div style="flex-grow: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div role="tablist" aria-label="Kitchen" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 2px solid #1E120A; background: #2A180D">
        <button role="tab" aria-selected="true" style="min-height: 44px; border: none; background: #F2E4C2; color: #3A2314; font-family: Fantaisie, serif; font-size: 19px; box-shadow: inset 0 -3px 0 #C9A04E">Meals</button>
        <button role="tab" aria-selected="false" style="min-height: 44px; border: none; background: transparent; color: #C9B48A; font-family: Fantaisie, serif; font-size: 19px">Supplies</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{items}}" as="item" hint-placeholder-count="12">
          <button aria-label="{{item.label}}" style="{{item.slotStyle}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="{{item.fill}}" stroke="#1E120A" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" style="opacity: {{item.op}}"><path d="{{item.path}}"/></svg>
            <span style="position: absolute; right: 3px; bottom: 1px; font-size: 13px; font-weight: 700; color: #F2E4C2; text-shadow: 0 1px 0 #1E120A">{{item.count}}</span>
            <sc-if value="{{item.short}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 2px; top: 2px; width: 10px; height: 10px; background: #B4471C; border: 2px solid #1E120A"></span></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding-top: 4px">
        <sc-for list="{{pantry}}" as="p" hint-placeholder-count="4">
          <span style="display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: #F2E4C2; color: #3A2314; border: 2px solid #1E120A; font-size: 14px"><span style="flex-grow: 1">{{p.n}}</span><b style="color: {{p.c}}">{{p.v}}</b></span>
        </sc-for>
      </div>
    </div>
  </div>

  <section aria-label="Hunter's stew details" style="position: absolute; left: 84px; top: 318px; width: 294px; background: #F2E4C2; color: #3A2314; border: 3px solid #1E120A; box-shadow: inset 0 0 0 3px #F2E4C2, inset 0 0 0 5px #C9A04E, 0 6px 0 #1E120A; display: flex; flex-direction: column">
    <div style="padding: 10px 14px 8px; background: repeating-linear-gradient(0deg, #5A3820 0 13px, #4E301B 13px 14px); border-bottom: 3px solid #1E120A; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: Fantaisie, serif; font-size: 24px; color: #F6D98E; line-height: 1.1">Hunter's Stew</span>
      <span style="font-size: 13px; color: #E2CFA4">Meal · shared by the whole party</span>
    </div>
    <div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; font-size: 15px; text-align: center">
      <span><span style="font-size: 26px; font-weight: 700">15%</span> <span style="color: #6A4A2C">max HP healed</span></span>
      <span style="color: #6A4A2C; font-size: 13px">just before the boss fight</span>
      <span style="color: #2F6B32; font-weight: 700; margin-top: 4px">Best for tier bosses</span>
      <span style="color: #6A4A2C; font-size: 14px">In your stores: <b style="color: #3A2314">1</b></span>
    </div>
    <div style="padding: 8px 14px; border-top: 2px dashed #B9A27A; display: flex; justify-content: center; gap: 8px">
      <sc-for list="{{reagents}}" as="r" hint-placeholder-count="3">
        <div style="position: relative; width: 54px; height: 54px; background: #3A2314; border: 2px solid #1E120A; outline: 2px solid #C9A04E; outline-offset: -5px; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="{{r.fill}}" stroke="#1E120A" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="{{r.path}}"/></svg>
          <span style="position: absolute; right: 3px; bottom: 1px; font-size: 13px; font-weight: 700; color: #F2E4C2; text-shadow: 0 1px 0 #1E120A">1/1</span>
        </div>
      </sc-for>
    </div>
    <button style="margin: 4px 14px 14px; min-height: 52px; border: 3px solid #1E120A; background: #B4471C; color: #FFF1DC; font-family: Fantaisie, serif; font-size: 26px; box-shadow: inset 3px 3px 0 #E07A3E, inset -3px -4px 0 #6E2A0E">Cook</button>
  </section>
  <div aria-hidden="true" style="position: absolute; left: 170px; top: 308px; width: 18px; height: 18px; background: #5A3820; border-left: 3px solid #1E120A; border-top: 3px solid #1E120A; transform: rotate(45deg)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      stew: 'M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z',
      fish: 'M3 12c3-4 9-5 13 0-4 5-10 4-13 0z M16 12l5-3v6z',
      bowl: 'M4 12h16a8 8 0 0 1-16 0z',
      pie: 'M3 14h18l-2 5H5z M4 14c1-5 15-5 16 0z',
      bites: 'M4 9h16l-2 3H6z M5 15h14l-1 3H6z',
      meat: 'M14 4a6 6 0 1 1-6 10l-4 4-1-1 4-4a6 6 0 0 1 7-9z',
      berry: 'M8 14a3 3 0 1 0 0 6a3 3 0 1 0 0-6z M15 12a3 3 0 1 0 0 6a3 3 0 1 0 0-6z',
      herb: 'M12 10c0-4 3-6 7-6 0 4-3 6-7 6z M12 14c0-3-2-5-6-5 0 3 2 5 6 5z M11 10h2v11h-2z'
    };
    const base = 'position: relative; aspect-ratio: 1; min-height: 60px; display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid #1E120A; ';
    const s = {
      sel: base + 'background: #7A4A26; outline: 2px solid #F6D98E; outline-offset: -6px; box-shadow: 0 0 0 2px #C9A04E;',
      ready: base + 'background: #2A180D; outline: 2px solid #8A6A34; outline-offset: -6px; box-shadow: inset 2px 2px 0 #160C06;',
      short: base + 'background: #2A180D; outline: 2px solid #4E301B; outline-offset: -6px; box-shadow: inset 2px 2px 0 #160C06;',
      empty: base + 'background: #2A180D; border-style: dashed; border-color: #4E301B;'
    };
    const raw = [
      ['stew', 'sel', '1', '#C9873A', "Hunter's stew, 1 in stock"], ['fish', 'short', '0', '#8FB0C9', 'Grilled trout, missing fish'], ['bowl', 'ready', '2', '#E8D6A8', "Scholar's porridge, 2"],
      ['pie', 'ready', '0', '#D9A55A', "Merchant's pie"], ['bites', 'ready', '3', '#D9B37A', 'Quick bites, 3']
    ];
    const items = raw.map(([p, k, count, fill, label]) => ({ path: P[p], slotStyle: s[k], count, fill, label, short: k === 'short', op: k === 'short' ? '0.55' : '1' }));
    for (let i = 0; i < 7; i++) items.push({ path: '', slotStyle: s.empty, count: '', fill: 'none', label: 'Recipe not found yet', short: false, op: '1' });
    return {
      items,
      pantry: [{ n: 'Meat', v: '2', c: '#3A2314' }, { n: 'Berries', v: '3', c: '#3A2314' }, { n: 'Herbs', v: '1', c: '#3A2314' }, { n: 'Fish', v: '0', c: '#B4471C' }],
      reagents: [{ path: P.meat, fill: '#C96A5A' }, { path: P.berry, fill: '#6A6AC9' }, { path: P.herb, fill: '#5E9A4A' }]
    };
  }
}
</script>
</body>
</html>
