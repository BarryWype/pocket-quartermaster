<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inventory — wood and brass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Fantaisie';src:url(/_blob/5b1e7bdb2a304b22ed34c8110385ae44) format('truetype');font-display:swap}
body{margin:0}
a{color:#C9A04E}a:hover{color:#E8C877}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: repeating-linear-gradient(0deg, #3A2314 0 23px, #331F11 23px 24px); color: #F2E4C2; font-family: Alegreya, Georgia, serif; display: flex; flex-direction: column">

  <header style="height: 66px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: repeating-linear-gradient(0deg, #5A3820 0 15px, #4E301B 15px 16px); border-bottom: 3px solid #1E120A; box-shadow: inset 0 -3px 0 #C9A04E">
    <a href="MapWood.dc.html" aria-label="Back to the map" style="width: 44px; height: 44px; background: #3A2314; border: 2px solid #1E120A; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; text-align: center; font-family: Fantaisie, serif; font-size: 30px; color: #F6D98E; text-shadow: 0 2px 0 #1E120A">Storeroom</div>
    <span style="width: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-weight: 700; font-size: 14px"><span style="width: 12px; height: 12px; border-radius: 6px; background: #E8B83A; border: 2px solid #7A5A24"></span>131</span>
  </header>

  <div style="display: flex; flex-grow: 1; min-height: 0">
    <nav aria-label="Storeroom" style="width: 74px; flex-shrink: 0; background: #2A180D; border-right: 3px solid #1E120A; box-shadow: inset -2px 0 0 #5A3820; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 14px">
      <sc-for list="{{rail}}" as="r" hint-placeholder-count="6">
        <button aria-label="{{r.label}}" style="{{r.style}}">
          <sc-if value="{{r.img}}" hint-placeholder-val="{{true}}"><img src="{{r.src}}" alt="" width="28" height="28" style="transform: rotate(-45deg); image-rendering: pixelated"></sc-if>
          <sc-if value="{{r.svg}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="{{r.fill}}" stroke="#1E120A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-45deg)"><path d="{{r.path}}"/></svg></sc-if>
        </button>
        <span style="font-family: Fantaisie, serif; font-size: 14px; color: {{r.color}}; margin: 0 0 6px; line-height: 1">{{r.label}}</span>
      </sc-for>
    </nav>

    <div style="flex-grow: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: Fantaisie, serif; font-size: 20px; color: #F6D98E">Materials</span>
        <span style="font-size: 13px; color: #C9B48A">Tier I · 9 kinds</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{items}}" as="item" hint-placeholder-count="16">
          <button aria-label="{{item.label}}" style="{{item.style}}">
            <sc-if value="{{item.img}}" hint-placeholder-val="{{false}}"><img src="{{item.src}}" alt="" width="36" height="36" style="image-rendering: pixelated"></sc-if>
            <sc-if value="{{item.svg}}" hint-placeholder-val="{{true}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="{{item.fill}}" stroke="#1E120A" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="{{item.path}}"/></svg></sc-if>
            <span style="position: absolute; right: 3px; bottom: 1px; font-size: 13px; font-weight: 700; color: #F2E4C2; text-shadow: 0 1px 0 #1E120A">{{item.n}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <section aria-label="Wood details" style="position: absolute; left: 84px; top: 248px; width: 294px; background: #F2E4C2; color: #3A2314; border: 3px solid #1E120A; box-shadow: inset 0 0 0 3px #F2E4C2, inset 0 0 0 5px #C9A04E, 0 6px 0 #1E120A; display: flex; flex-direction: column">
    <div style="padding: 10px 14px 8px; background: repeating-linear-gradient(0deg, #5A3820 0 13px, #4E301B 13px 14px); border-bottom: 3px solid #1E120A; display: flex; align-items: center; gap: 10px">
      <img src="/_blob/8c840ef431d52c2916e1cac29e59fe8f" alt="" width="40" height="40" style="image-rendering: pixelated; background: #2A180D; border: 2px solid #C9A04E">
      <span style="display: flex; flex-direction: column">
        <span style="font-family: Fantaisie, serif; font-size: 23px; color: #F6D98E; line-height: 1">Wood</span>
        <span style="font-size: 13px; color: #E2CFA4">Tier I main material · 24 held</span>
      </span>
    </div>
    <div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
      <span style="font-weight: 700; color: #6A4A2C">Used in</span>
      <div style="display: flex; flex-wrap: wrap; gap: 5px">
        <sc-for list="{{uses}}" as="u" hint-placeholder-count="5"><span style="padding: 1px 7px; background: #E6D3A8; border: 2px solid #B9A27A; font-weight: 700; font-size: 13px">{{u}}</span></sc-for>
      </div>
      <span style="color: #6A4A2C">Gathered from trees on your walks.</span>
    </div>
    <div style="padding: 8px 14px 12px; border-top: 2px dashed #B9A27A; display: flex; gap: 8px">
      <button style="flex: 1; min-height: 44px; border: 2px solid #1E120A; background: #3A2314; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; font-family: Fantaisie, serif; font-size: 17px">Show on map</button>
      <button style="flex: 1; min-height: 44px; border: 2px solid #1E120A; background: #3A2314; outline: 2px solid #C9A04E; outline-offset: -5px; color: #F6D98E; font-family: Fantaisie, serif; font-size: 17px">Recipes</button>
    </div>
  </section>
  <div aria-hidden="true" style="position: absolute; left: 102px; top: 238px; width: 18px; height: 18px; background: #5A3820; border-left: 3px solid #1E120A; border-top: 3px solid #1E120A; transform: rotate(45deg)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      sword: '', bag: 'M6 8h12l1 12H5z M9 8V5h6v3',
      map: 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z', gem: 'M6 4h12l3 5-9 11L3 9z',
      key: 'M8 14a4 4 0 1 0 0-8a4 4 0 1 0 0 8z M11 11l9 9-2 2-3-3-1 1-2-2 1-1-4-4z',
      bone: 'M7 7a2 2 0 1 1 2-3 2 2 0 1 1 3 2l6 6a2 2 0 1 1 3 2 2 2 0 1 1-2 3 2 2 0 1 1-3-2L7 9a2 2 0 1 1-3-2z',
      hide: 'M6 4h12l-2 4 3 4-3 4 2 4H6l2-4-3-4 3-4z',
      herb: 'M12 10c0-4 3-6 7-6 0 4-3 6-7 6z M12 14c0-3-2-5-6-5 0 3 2 5 6 5z M11 10h2v11h-2z',
      berry: 'M8 14a3 3 0 1 0 0 6a3 3 0 1 0 0-6z M15 12a3 3 0 1 0 0 6a3 3 0 1 0 0-6z',
      meat: 'M14 4a6 6 0 1 1-6 10l-4 4-1-1 4-4a6 6 0 0 1 7-9z',
      mush: 'M4 12a8 7 0 0 1 16 0z M10 12h4v8h-4z',
      fang: 'M6 4h12l-3 9-3 7-3-7z'
    };
    const rd = 'width: 46px; height: 46px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid #1E120A; margin-top: 8px; ';
    const rail = [
      { label: 'Materials', img: true, src: '/_blob/8c840ef431d52c2916e1cac29e59fe8f', on: true },
      { label: 'Gear', img: true, src: '/_blob/0f279c5cf7058afc885afe00c6c6f6fe' },
      { label: 'Provisions', img: true, src: '/_blob/cc5846841f2e109471763a9e47915d87' },
      { label: 'Treasures', path: P.map, fill: '#E8D6A8' },
      { label: 'Finds', path: P.gem, fill: '#6FC1D9' },
      { label: 'Secrets', path: P.key, fill: '#E8B83A' }
    ].map((r) => ({ ...r, img: !!r.img, svg: !r.img, src: r.src ?? '', path: r.path ?? '', fill: r.fill ?? 'none', color: r.on ? '#F6D98E' : '#C9B48A', style: rd + (r.on ? 'background: #7A4A26; outline: 2px solid #F6D98E; outline-offset: -6px; box-shadow: 0 0 0 2px #C9A04E;' : 'background: #3A2314; outline: 2px solid #8A6A34; outline-offset: -6px;') }));
    const base = 'position: relative; aspect-ratio: 1; min-height: 60px; display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid #1E120A; ';
    const s = {
      sel: base + 'background: #7A4A26; outline: 2px solid #F6D98E; outline-offset: -6px; box-shadow: 0 0 0 2px #C9A04E;',
      ready: base + 'background: #2A180D; outline: 2px solid #8A6A34; outline-offset: -6px; box-shadow: inset 2px 2px 0 #160C06;',
      empty: base + 'background: #2A180D; border-style: dashed; border-color: #4E301B;'
    };
    const raw = [
      { k: 'sel', src: '/_blob/8c840ef431d52c2916e1cac29e59fe8f', n: '24', label: 'Wood, 24, selected' },
      { k: 'ready', src: '/_blob/9209ee665b39608e32025545f5192bf2', n: '6', label: 'Stone, 6' },
      { k: 'ready', path: P.bone, fill: '#EDE3CC', n: '9', label: 'Bone, 9' },

    return { rail, items, uses: ['Wooden sword', 'Wooden bow', 'Wooden wand', 'Shield', 'Plate', 'Wooden pickaxe'] };
  }
}
</script>
</body>
</html>
